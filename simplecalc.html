<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>

    <h1>Simple Calculator</h1>


    <input type="number" id="num1" placeholder="enter the first number">
    <input type="number" id="num2" placeholder="enter the second number">
    <input type="color" id="text">
   

<button onClick="a()">setcolor</button>
    
    <button id="b1" onclick="calculate('+')">+</button>
    <button id="b2" onclick="calculate('-')">-</button>
    <button id="b3" onclick="calculate('*')">*</button>
    <button id="b4" onclick="calculate('/')">/</button>
    
      
    


    <script>
        function calculate(opr){
            result=0
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            switch(opr){
                case '+':result=num1+num2 
                break;
                case '-':result=num1-num2 
                break;
                case '*':result=num1*num2 
                break;
                case '/':result=num2!=0?num1/num2:"divide by zero" 
                break;
                
            }}
function a(){
var colorValue = document.getElementById("text").value;  
document.body.style.backgroundColor=colorValue;
}
    </script>


    <h2>Result: <span id="result"></span></h2> 

</body>
</html>
