<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Text Change</title>

</head>
<body>
    <h1 id="textToChange">Original Text</h1>
    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            const element = document.getElementById("textToChange");
            element.innerText = "Text Changed Dynamically!";
        }
    </script>
</body>
</html>
